name: CI

on:
  push:
    branches: [main, "release/**", "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: "Lint & Type-check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/${{ matrix.app }}/package-lock.json"

      - name: Install deps
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Type-check
        working-directory: apps/${{ matrix.app }}
        run: npm run type-check || true

  build-web:
    name: "Build web (production)"
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - run: npm ci
        working-directory: apps/web

      - name: Build Next.js (web mode)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.dabacash.ma
        run: npm run build

  validate-schema:
    name: "Validate Prisma schema"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "packages/database/package-lock.json"

      - run: npm ci
        working-directory: packages/database

      - name: Validate Prisma schema
        working-directory: packages/database
        run: npx prisma validate
