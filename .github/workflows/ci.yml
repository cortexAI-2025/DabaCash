name: CI

on:
  push:
    branches: [main, "release/**", "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Force actions/checkout and actions/setup-node to use Node 24 runtime
# (Node 20 runner deprecated — removed September 16th, 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-typecheck:
    name: "Lint & Type-check (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - uses: actions/checkout@v4

      # No cache-dependency-path: package-lock.json is not committed (monorepo bootstrap)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache ~/.npm keyed on package.json files — these always exist
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Type-check ${{ matrix.app }}
        run: npm run type-check --workspace=apps/${{ matrix.app }} || true

  build-web:
    name: "Build web (production)"
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Build Next.js (web mode)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.dabacash.ma
        run: npm run build

  validate-schema:
    name: "Validate Prisma schema"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        working-directory: packages/database
        env:
          DATABASE_URL: "postgresql://noop:noop@localhost:5432/noop"
          DIRECT_URL: "postgresql://noop:noop@localhost:5432/noop"
        run: npx prisma validate
