name: CI

on:
  push:
    branches: [main, "release/**", "claude/**", "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api:
    name: "API: types, lint, migrations, unit + integration tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dabacash
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dabacash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dabacash"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database. Never a real secret.
      DATABASE_URL: postgresql://dabacash:ci-only-password@localhost:5432/dabacash_test
      DIRECT_URL: postgresql://dabacash:ci-only-password@localhost:5432/dabacash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        working-directory: packages/database
        run: npx prisma generate
      - name: Apply migrations to an empty database
        working-directory: packages/database
        run: npx prisma migrate deploy
      - name: Schema and migrations must not drift
        working-directory: packages/database
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run type-check --workspace=apps/api
      - run: npm run lint --workspace=apps/api
      - run: npm test --workspace=apps/api
      - name: Integration tests (full Nest app against real Postgres)
        run: npm run test:e2e --workspace=apps/api
      - name: Build
        run: npm run build --workspace=apps/api

  web:
    name: "Web: types, lint, production + mobile builds"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check --workspace=apps/web
      - run: npm run lint --workspace=apps/web
      - name: Build (web)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npm run build
      - name: Build (static export used by the Android app)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npm run build:mobile

  security:
    name: "Dependency audit (production dependencies)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on high/critical advisories in what ships. Dev tooling is reported in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high
