name: CI

on:
  push:
    branches: [main, "release/**", "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: "Lint & Type-check (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # FIX: don't cancel sibling jobs when one leg fails
      matrix:
        app: [web, api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"   # FIX: root lockfile (monorepo)

      - name: Install dependencies
        run: npm install                                # FIX: install from root, not per-app

      - name: Type-check ${{ matrix.app }}
        run: npm run type-check --workspace=apps/${{ matrix.app }} || true  # FIX: workspace flag

  build-web:
    name: "Build web (production)"
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"   # FIX: root lockfile

      - name: Install dependencies
        run: npm install                                # FIX: root install

      - name: Build Next.js (web mode)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.dabacash.ma
        run: npm run build

  validate-schema:
    name: "Validate Prisma schema"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"   # FIX: root lockfile

      - name: Install dependencies
        run: npm install                                # FIX: root install (resolves workspace symlinks)

      - name: Validate Prisma schema
        working-directory: packages/database
        env:
          # prisma validate only reads schema.prisma — dummy URL satisfies env check
          DATABASE_URL: "postgresql://noop:noop@localhost:5432/noop"
          DIRECT_URL: "postgresql://noop:noop@localhost:5432/noop"
        run: npx prisma validate
